# configs/env.yaml
# Core environment settings shared across all agents

grid:
  size: 60            # grid is size x size (cells)
  cell_size: 0.2      # meters per cell (informational)

episode:
  max_steps: 500      # T_max timesteps per episode

sensor:
  rays: 36            # number of range rays (angular)
  max_range: 12       # max range in cells
  range_noise: 0.2    # gaussian sigma in cell units

motion:
  slip_probability: 0.02   # prob that forward command fails (slip)

victim:
  detection_mode: "los"    # "los" (line of sight) or "proximity"
  detection_range: 1       # if proximity mode

maps:
  train_count: 200
  val_count: 30
  test_count: 30
  procedural:
    rooms_range: [4, 12]
    corridor_width: [2, 5]
    obstacle_density_range: [0.05, 0.15]

seeds:
  base_seed: 1000           # base seed for reproducibility
  runs_per_map: 10